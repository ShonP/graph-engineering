name: Validate plugin
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - name: Run all tests
        run: bash scripts/run-all-tests.sh
