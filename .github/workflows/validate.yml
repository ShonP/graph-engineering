name: Validate plugin
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - name: Hook regressions
        run: |
          bash hooks/tests/run-tests.sh
          python3 hooks/tests/test_configured_checks.py
          python3 -m unittest discover -s tests/usage -v
      - name: Control regressions
        run: uv run --with PyYAML==6.0.2 python -m unittest discover -s tests/graph_control -v
      - name: Compose isolation regressions
        run: bash skills/process/qa-verification/tests/test_compose_isolation.sh
