name: gate
on:
  push:
  pull_request:
permissions:
  contents: read
  statuses: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: local
        run: bash scripts/ci/local-gate-status.sh check || true
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Gate
        if: steps.local.outputs.verified != 'true'
        run: nice -n 10 bash __CI_GATE__.sh
