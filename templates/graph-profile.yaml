# graph-engineering project profile. It belongs to THIS repo: a plugin update
# replaces agents, skills and playbooks, never this file. Generated by
# /graph-init; edit freely. `/graph-init --upgrade` adds missing blocks, drops
# removed keys and shows a diff before it writes; rollback is `git revert`.
schema_version: 2

# Where each stack lives: one entry per manifest directory, named by you, with
# the glob that holds the code, not "**". /graph-init derives it; ships empty, e.g.:
#   stacks:
#     api: { paths: ["services/api/**"] }   # services/api/pyproject.toml
#     ui:  { paths: ["ui/**"] }             # ui/package.json
stacks: {}

# Rule packs agents Read before working (path-scoped packs do not auto-load into a subagent).
rules: [".claude/rules/*.md"]

# Files that steer agents: a diff here always gets a full review, even prose.
instructionPaths: ["CLAUDE.md", "**/CLAUDE.md", "AGENTS.md", ".claude/**"]

# Optional owner access map; the engine injects it into planner and spike briefs.
ownerAccess: ""

# Where specs and plans go.
docsPath: "docs/superpowers"

# Before/after evidence for every visible change, committed as
# <path>/<date>-<slug>/ and embedded in the PR body (see `ux-evidence`).
# `store` keeps the media out of git: each value is a repo-root command prefix,
# and the evidence folder or file is appended (push uploads, pull downloads,
# link prints a short-lived URL). Empty keeps the media committed.
uxEvidence:
  path: "docs/ux/changes"
  store:
    push: ""
    pull: ""
    link: ""

# How qa stands this repo up on an isolated live stack; each field is a
# repo-root shell command. Ships empty; /graph-init fills what it detects, and an
# empty required field is qa BLOCKED naming it. `none` (a reason) replaces every
# field; `env` lists NAMES only; health `expect` is a raw substring such as `ok`.
# Compose runs as `-p ge-${GRAPH_RUN_ID:?}`. Fields, isolation and health: see
# `qa-verification` step 2; the compose override: commands/graph-init.md step 4.
runtime:
  # Optional bounded harness; set, it replaces up/seed/health/baseUrl/down.
  command: ""
  up: ""
  seed: ""
  port: null
  health: { url: "", expect: "", timeout: 120 }
  baseUrl: ""
  down: ""
  env: []
  none: ""

# Where a merged change is checked after deploy, on a SHARED environment, so
# read-only: `smoke` Bruno requests (writes only into `testTenant`) and PromQL.
# Empty `wait` reports the deploy checks SKIPPED. `env` lists NAMES only;
# `rollback` is the command qa fills in for the owner, never runs. Fields: see
# `post-deploy-verification`.
deploy:
  wait: ""
  startedAt: ""
  bruEnv: ""
  env: []
  testTenant: ""
  checks: []
  rollback: ""

# The investigate lane's signal source: an aggregates-only command with masked
# output (counts, rates, pseudonymised ids), run verbatim by the researcher's
# `signals` mode. Commit it here and give it one `privacy-review`. Empty: the
# investigate lane reports BLOCKED naming this key.
pulse:
  command: ""

# How qa proves an infra change. `cluster` is a THROWAWAY cluster with its own
# kubeconfig, never ~/.kube/config; empty means static-only verification
# (`PASS (static-only)`, which --auto-merge refuses). Fields and examples: see
# `infra-verification`.
infra:
  cluster: { create: "", delete: "", context: "" }
  prereqs: []
  render: ""
  policy: ""

# Commands run in order from the root of each new task worktree before any agent
# works in it: dependency install and code generation. /graph-init proposes them
# from the lockfiles; ships empty, e.g.:
#   bootstrap:
#     - uv sync --frozen                           # uv.lock
bootstrap: []

# Host resources serialized across agents: lane name -> slots. Each command that
# uses a lane runs as
#   scripts/lane-run.sh <lane> --slots <n> -- <command>
# Slots = the independent instances the host can run at once. Prefer a
# per-task namespace from GRAPH_RUN_ID over a lane. Ships empty, e.g.:
#   lanes: {xcodebuild: 1, xctest: 2, cluster: 1, local_db: 1}
# An undeclared lane is not serialized; a left-out xctest takes the xcodebuild
# count. Lane meanings: commands/graph-init.md (Lanes); the elastic mapping
# form: docs/engine/lanes.md.
lanes: {}

# The free-disk floor in GB that `graph-control host-check` holds
# before each implementer dispatch; below it the dispatch is BLOCKED. 20 for containers,
# device builds or `lanes`; 5 is plenty for a `runtime.none` library or CLI.
host:
  min_free_gb: 20

# Older simulator or device runtimes qa covers beyond the newest, each at depth
# `full` or `smoke`, e.g. [{name: "iOS 18.6", depth: smoke}]. See `qa-verification`.
qa:
  runtimes: []

# Where the Bruno collection lives and the schema Schemathesis reads. See `api-contract`.
api:
  collection: "bruno"
  env: "local"
  # A path under baseUrl, or a repo file.
  schema: "/openapi.json"

# Each agent's REQUIRED skills, by path glob; agents never pick their own.
# Plugin skills are written qualified (`graph-engineering:<name>`), a repo's own
# .claude/skills bare. Globs are globstar plus braces; check one with
#   wcmatch.glob.globmatch(path, key, flags=GLOBSTAR | BRACE | DOTGLOB)
# never `git ls-files` (no brace expansion). A path's skills are the union of
# every row it matches.
routing:
  # Dependency-derived rows (applied by /graph-init)
  #
  # Frameworks route by what a manifest declares, never by file extension. This
  # block is the single source /graph-init reads: for each manifest, every row
  # whose `when` holds is written below with <dir> as the manifest's directory
  # ("<dir>/**/*.py" becomes "**/*.py" at the root). Rules:
  #   - Rows with the same glob, derived or static, merge into one key (the union).
  #   - The nearest manifest owns a file; a tooling-only workspace root writes no row.
  #   - A dependency not listed routes nothing; uncovered manifests and every
  #     `gap` go into the approval summary. Never guess a skill.
  #   - pydantic-house-rules wins over the vendored pydantic skill where they disagree.
  # Uncommented, the lines from `derived:` on are YAML.
  # derived:
  #   - when: package.json in <dir> depends on react (react-dom, next, ...)
  #     glob: "<dir>/**/*.{ts,tsx,js,jsx}"
  #     impl: [graph-engineering:react-rules, graph-engineering:frontend-rules, graph-engineering:ux-evidence]
  #     review: [graph-engineering:react-rules, graph-engineering:frontend-rules, graph-engineering:ux-evidence]
  #     qa: [graph-engineering:ux-evidence]
  #   - when: the react package.json also depends on @tanstack/react-query
  #     glob: "<dir>/**/*.{ts,tsx,js,jsx}"
  #     impl: [graph-engineering:tanstack-query-rules]
  #     review: [graph-engineering:tanstack-query-rules]
  #   - when: the react package.json also depends on @tanstack/react-router
  #     glob: "<dir>/**/*.{ts,tsx,js,jsx}"
  #     impl: [graph-engineering:tanstack-router]
  #   - when: the react package.json also depends on tailwindcss
  #     glob: "<dir>/**/*.{ts,tsx,js,jsx}"
  #     impl: [graph-engineering:tailwind]
  #     review: [graph-engineering:tailwind]
  #   - when: package.json in <dir> depends on tailwindcss
  #     glob: "<dir>/**/*.css"
  #     impl: [graph-engineering:tailwind]
  #     review: [graph-engineering:tailwind]
  #   - when: the react package.json also depends on react-hook-form, i18next or react-i18next
  #     glob: "<dir>/**/*.{ts,tsx,js,jsx}"
  #     impl: [graph-engineering:forms-i18n]
  #     review: [graph-engineering:forms-i18n]
  #   - when: package.json in <dir> has no UI framework (express, fastify, hono, @nestjs/core or none)
  #     glob: "<dir>/**/*.{ts,js}"
  #     impl: [graph-engineering:backend-rules]
  #     review: [graph-engineering:backend-rules]
  #   - when: turbo.json at the repo root
  #     glob: "{**/turbo.json,pnpm-workspace.yaml,**/package.json}"
  #     impl: [graph-engineering:turborepo]
  #     review: [graph-engineering:turborepo]
  #   - when: pyproject.toml in <dir> depends on pydantic (fastapi implies it)
  #     glob: "<dir>/**/*.py"
  #     impl: [graph-engineering:pydantic, graph-engineering:pydantic-house-rules]
  #     review: [graph-engineering:pydantic, graph-engineering:pydantic-house-rules]
  #   - when: pyproject.toml in <dir> depends on fastapi
  #     glob: "<dir>/**/*.py"
  #     impl: [graph-engineering:fastapi, graph-engineering:backend-rules, graph-engineering:architecture-resilience-rules]
  #     review: [graph-engineering:fastapi, graph-engineering:backend-rules, graph-engineering:architecture-resilience-rules]
  #   - when: pyproject.toml in <dir> depends on sqlalchemy or alembic
  #     glob: "<dir>/**/{models,db,migrations}/**/*.py"
  #     impl: [graph-engineering:sqlalchemy]
  #     review: [graph-engineering:sqlalchemy]
  #   - when: pyproject.toml in <dir> depends on sqlalchemy or alembic
  #     glob: "<dir>/**/alembic/**"
  #     impl: [graph-engineering:sqlalchemy]
  #     review: [graph-engineering:sqlalchemy]
  #   - when: pyproject.toml in <dir> depends on temporalio
  #     glob: "<dir>/**/{workflows,activities}/**/*.py"
  #     impl: [graph-engineering:temporal-developer, graph-engineering:architecture-resilience-rules]
  #     review: [graph-engineering:temporal-developer, graph-engineering:architecture-resilience-rules]
  #   - when: pyproject.toml in <dir> depends on agent-framework
  #     glob: "<dir>/**/agents/**/*.py"
  #     impl: [graph-engineering:microsoft-agent-framework, graph-engineering:agent-workflow-rules]
  #     review: [graph-engineering:microsoft-agent-framework, graph-engineering:agent-workflow-rules]
  #   - when: pyproject.toml in <dir> depends on pydantic-ai
  #     glob: "<dir>/**/agents/**/*.py"
  #     impl: [graph-engineering:building-pydantic-ai-agents, graph-engineering:agent-workflow-rules]
  #     review: [graph-engineering:building-pydantic-ai-agents, graph-engineering:agent-workflow-rules]
  #   - when: pyproject.toml in <dir> depends on loguru
  #     glob: "<dir>/**/logging*.py"
  #     impl: [graph-engineering:loguru]
  #     review: [graph-engineering:loguru]
  #   - when: a .swift file under <dir> imports SwiftUI (<dir> holds Package.swift, project.yml or the .xcodeproj)
  #     glob: "<dir>/**/*.swift"
  #     impl: [graph-engineering:swiftui-pro, graph-engineering:ux-evidence]
  #     review: [graph-engineering:swiftui-pro, graph-engineering:ux-evidence]
  #     qa: [graph-engineering:ux-evidence]
  #   - when: the Gradle build in <dir> uses androidx.compose
  #     glob: "<dir>/**/*.{kt,kts}"
  #     impl: [graph-engineering:compose-state, graph-engineering:compose-ui, graph-engineering:ux-evidence]
  #     review: [graph-engineering:compose-performance, graph-engineering:compose-state, graph-engineering:ux-evidence]
  #     qa: [graph-engineering:compose-build-and-test, graph-engineering:ux-evidence]
  #   - when: supabase/config.toml under <dir> (<dir> holds the supabase/ directory)
  #     glob: "<dir>/supabase/**"
  #     impl: [graph-engineering:supabase, graph-engineering:supabase-postgres-best-practices]
  #     review: [graph-engineering:supabase, graph-engineering:supabase-postgres-best-practices]
  #   - when: go.mod, Cargo.toml, Gemfile or pom.xml in <dir>
  #     glob: "<dir>/**"
  #     impl: [graph-engineering:backend-rules]
  #     review: [graph-engineering:backend-rules]
  #     gap: "the plugin has no Go, Rust, Ruby or Java stack skill; name the language found"

  # Static rows: language or file type only. Drop the rows this repo has no files for.
  "{**/turbo.json,pnpm-workspace.yaml}":
    impl: [graph-engineering:turborepo]
    review: [graph-engineering:turborepo]
  # Apple frameworks by Swift file name (Swift only: a web NotificationBell.tsx never matches).
  "**/{Health,Workout}*.swift": { impl: [graph-engineering:healthkit] }
  "**/{Widget,LiveActivity}*.swift": { impl: [graph-engineering:widgetkit, graph-engineering:activitykit] }
  "**/{Photo,Camera}*.swift": { impl: [graph-engineering:photokit] }
  "**/*[Nn]otification*.swift": { impl: [graph-engineering:push-notifications] }
  "**/*.{kt,kts}":
    impl: [graph-engineering:kotlin-concurrency, graph-engineering:kotlin-types-value-class]
    review: [graph-engineering:kotlin-control-flow]
  # Postgres SQL; drop the row if the database is not Postgres.
  "**/*.sql":
    impl: [graph-engineering:supabase-postgres-best-practices]
    review: [graph-engineering:supabase-postgres-best-practices]
    qa: []
  "**/{migrations,schemas}/**":
    impl: [graph-engineering:gdpr-erasure-retention]
    review: [graph-engineering:gdpr-erasure-retention, graph-engineering:gdpr-consent]
    qa: []
  # uv and ruff: drop both here and below if the repo uses another Python toolchain.
  "**/*.py":
    impl: [graph-engineering:uv, graph-engineering:ruff]
    review: [graph-engineering:ruff]
    qa: []
  "**/{pyproject.toml,uv.lock,.python-version}":
    impl: [graph-engineering:uv]
    review: [graph-engineering:uv]
  "**/alembic/**":
    impl: [graph-engineering:sqlalchemy]
    review: [graph-engineering:sqlalchemy]
  # Infra rows carry infra-verification: the implementer renders the diff, qa runs the recipe.
  "argocd/**/*.{yaml,yml}":
    impl: [graph-engineering:argocd, graph-engineering:helm, graph-engineering:kubectl, graph-engineering:architecture-resilience-rules, graph-engineering:infra-verification]
    review: [graph-engineering:argocd, graph-engineering:helm]
    qa: [graph-engineering:kubectl, graph-engineering:infra-verification]
  "manifests/**":
    impl: [graph-engineering:kubectl, graph-engineering:kustomize, graph-engineering:infra-verification]
    review: [graph-engineering:kubectl]
    qa: [graph-engineering:kubectl, graph-engineering:infra-verification]
  "**/Chart.yaml":
    impl: [graph-engineering:helm, graph-engineering:infra-verification]
    review: [graph-engineering:helm]
    qa: [graph-engineering:infra-verification]
  # Anchored under chart/ or charts/: a bare **/templates/** matches unrelated templates.
  "**/{chart,charts}/**/templates/**/*.{yaml,yml,tpl}":
    impl: [graph-engineering:helm, graph-engineering:infra-verification]
    review: [graph-engineering:helm]
    qa: [graph-engineering:infra-verification]
  "**/kustomization.{yaml,yml}":
    impl: [graph-engineering:kustomize, graph-engineering:infra-verification]
    review: [graph-engineering:kustomize]
    qa: [graph-engineering:infra-verification]
  # A glob cannot see `apiVersion`, so CNPG and Envoy Gateway route on directory and file names.
  "**/{postgres,cnpg}/**":
    impl: [graph-engineering:cloudnativepg]
    review: [graph-engineering:cloudnativepg]
  "**/*-pg/**":
    impl: [graph-engineering:cloudnativepg]
    review: [graph-engineering:cloudnativepg]
  "**/*-pg-*/**":
    impl: [graph-engineering:cloudnativepg]
    review: [graph-engineering:cloudnativepg]
  "**/{httproute,securitypolicy,backendtlspolicy,backendtrafficpolicy,clienttrafficpolicy,gateway,gatewayclass,referencegrant}*.{yaml,yml}":
    impl: [graph-engineering:envoy-gateway]
    review: [graph-engineering:envoy-gateway, graph-engineering:security-review]
  "**/{gateway,gateway-*}/**":
    impl: [graph-engineering:envoy-gateway]
    review: [graph-engineering:envoy-gateway, graph-engineering:security-review]
  "**/{ai-gateway,agent-router,llm-gateway}/**":
    impl: [graph-engineering:agent-router, graph-engineering:envoy-gateway]
    review: [graph-engineering:agent-router, graph-engineering:security-review]
  "{.sops.yaml,**/*.enc.yaml,**/*.enc.yml}":
    impl: [graph-engineering:sops-age]
    review: [graph-engineering:sops-age, graph-engineering:security-review]
    qa: []
  "{tests/**/*.spec.ts,playwright.config.ts}":
    impl: [graph-engineering:playwright-cli, graph-engineering:playwright-component-testing]
    review: [graph-engineering:playwright-cli]
    qa: [graph-engineering:playwright-cli, graph-engineering:playwright-trace, graph-engineering:ux-evidence]
  "{**/*.bru,**/bruno.json}":
    impl: [graph-engineering:bruno, graph-engineering:api-contract]
    review: [graph-engineering:bruno, graph-engineering:api-contract]
    qa: [graph-engineering:bruno, graph-engineering:api-contract]
  # API surfaces (server-side layouts, plus the spec file); keep in step with the
  # `api-surface` risk row. routes/ and handlers/ exclude TS on purpose: there
  # they are often frontend routes, which cannot serve a schema.
  "**/{routers,controllers,endpoints}/**/*.{py,go,java,kt,rb,ts,js}":
    impl: [graph-engineering:bruno, graph-engineering:schemathesis, graph-engineering:api-contract]
    review: [graph-engineering:api-contract]
    qa: [graph-engineering:bruno, graph-engineering:schemathesis, graph-engineering:api-contract]
  "**/{routes,handlers}/**/*.{py,go,java,kt,rb}":
    impl: [graph-engineering:bruno, graph-engineering:schemathesis, graph-engineering:api-contract]
    review: [graph-engineering:api-contract]
    qa: [graph-engineering:bruno, graph-engineering:schemathesis, graph-engineering:api-contract]
  "{**/*.controller.{ts,js},**/app/api/**/route.{ts,js},**/pages/api/**/*.{ts,js}}":
    impl: [graph-engineering:bruno, graph-engineering:schemathesis, graph-engineering:api-contract]
    review: [graph-engineering:api-contract]
    qa: [graph-engineering:bruno, graph-engineering:schemathesis, graph-engineering:api-contract]
  "**/{openapi,asyncapi,swagger}*.{yaml,yml,json}":
    impl: [graph-engineering:bruno, graph-engineering:schemathesis, graph-engineering:api-contract]
    review: [graph-engineering:api-contract]
    qa: [graph-engineering:bruno, graph-engineering:schemathesis, graph-engineering:api-contract]
  "{observability/**,**/dashboards/**/*.json,**/*rule*.{yaml,yml}}":
    impl: [graph-engineering:promql, graph-engineering:loki, graph-engineering:tempo]
    review: [graph-engineering:promql, graph-engineering:loki, graph-engineering:tempo]
    qa: [graph-engineering:promql, graph-engineering:loki, graph-engineering:tempo]
  always:
    # definition-of-done and impact-map are preloaded in agent frontmatter, so not listed.
    impl: [graph-engineering:prior-art, graph-engineering:review-testing-rules]
    review: [graph-engineering:review-protocol, graph-engineering:security-review, graph-engineering:privacy-review]
    design: [graph-engineering:ux-journey, graph-engineering:ui-ux-pro-max]

# Role -> a .claude/agents name the engine dispatches instead of the plugin's. Empty: full roster.
localAgents: {}

# Role -> list of .claude/agents names that run BESIDE the plugin one.
localLanes: {}

# Model tier per roster role (opus or sonnet), the single source of tiers. The
# guard-agent hook blocks an Agent call whose type is in `block_types` or whose
# model is in `never`; a `policy-override: <reason>` line skips it, logged. See
# docs/graph-controls.md.
policy:
  roles:
    planner: opus
    ux-designer: opus
    implementer: opus
    reviewer: opus
    reviewer-lead: opus
    implementer-simple: sonnet
    researcher: sonnet
    researcher-spike: sonnet
    qa: sonnet
    qa-lead: sonnet
    retro: sonnet
  never: [haiku, fable]
  block_types: [general-purpose]

# Risk classes read by the router, the depth check and `gates`. A diff matches a
# row by a changed path (routing glob dialect) or an added line containing a
# keyword: literal and case-sensitive; `re:` makes it a Python regex with no
# nested quantifiers, skipped on lines over 4,096 characters. Keywords
# never read prose files. Starting points: tune them, every extra keyword is a
# false positive.
# Built in and reserved: `agent-control`, covering .claude/**, CLAUDE.md,
# AGENTS.md, .mcp.json, .github/** and every `instructionPaths` glob; it always
# waits for the owner and no row can redefine it. See docs/graph-controls.md.
risk:
  - id: db-schema
    paths: ["**/migrations/**", "**/*.sql", "**/alembic/**"]
    keywords: ["DROP TABLE", "ALTER TABLE"]
  - id: api-surface   # the API-surface rows from `routing`; keep the two in step
    paths:
      - "**/{routers,controllers,endpoints}/**/*.{py,go,java,kt,rb,ts,js}"
      - "**/{routes,handlers}/**/*.{py,go,java,kt,rb}"
      - "{**/*.controller.{ts,js},**/app/api/**/route.{ts,js},**/pages/api/**/*.{ts,js}}"
      - "**/{openapi,asyncapi,swagger}*.{yaml,yml,json}"
    keywords: []
  - id: auth
    paths: ["**/{auth,authz,authentication,permissions,rbac}/**"]
    keywords: []
  - id: infra
    paths: ["argocd/**", "manifests/**", "**/Chart.yaml", "**/*.tf", ".github/workflows/**"]
    keywords: []
  - id: public-copy
    # The repo lists its public pages and templates here; nothing generic can guess them.
    paths: []
    keywords: []
  - id: outbound-messaging
    paths: ["**/{email,emails,mailers,notifications,notifier*}/**"]
    keywords: []
  - id: spend
    # Provider call spellings, never bare words (`stripe` matches `table-striped`);
    # add this repo's own provider calls.
    paths: ["**/{billing,payments}/**"]
    keywords: ["stripe.", "Stripe("]
  - id: destructive
    # Uppercase SQL, plus regexes for lowercase SQL that opens a statement.
    paths: []
    keywords:
      - "DROP TABLE"
      - "DROP DATABASE"
      - "DROP SCHEMA"
      - "DROP COLUMN"
      - "DROP VIEW"
      - "DROP INDEX"
      - "DELETE FROM"
      - 're:\bTRUNCATE\s+(?:TABLE\b|ONLY\b|[A-Za-z_"''`{$])'
      - 're:(?:^|["''`(;])\s*(?:drop|truncate)\s+(?:table|database|schema|view|index)\b'
      - 're:(?:^|["''`(;])\s*delete\s+from\s+\S'
      - 're:\balter\s+table\s+\S+\s+drop\s+column\b'
  - id: credentials-and-access
    paths: [".sops.yaml", "**/*.enc.{yaml,yml}", "**/.env*"]
    keywords: []
  - id: outside-the-run
    # `graph-control depth --plan <run>/plan.json` reports it when a changed path
    # matches no task's writable_paths. Remove the row to switch the check off.
    paths: []
    keywords: []

# Who approves. The plan gate always stops; merge stops unless the class lists
# open it. `owner_classes` (risk ids) always wait for the owner. A diff whose
# every class is in `auto_classes` merges on full green; `[none]` covers diffs
# matching no risk row. `agent-control` always waits, even under --auto-merge.
# `quick` is a command, not an approver: the fast pre-push check every
# implementer runs before DONE; "" means none. See `definition-of-done`.
gates:
  plan: owner   # also the design gate: the plan embeds the `design` node's spec
  merge: owner
  owner_classes: [destructive, credentials-and-access, spend, outbound-messaging]
  auto_classes: []
  quick: ""     # e.g. "bash scripts/ci/quick-gate.sh"

# `pr` opens a pull request; `push-main` pushes to the default branch after the merge gate.
integration: pr

# A diff over `panel_lines` changed lines, or touching every stack of one `seams`
# list (e.g. [[api, web]]), gets a panel review.
review:
  panel_lines: 2000
  seams: []

# Globs excluded from LOC in the change digest at the merge gate, so it tracks
# the product change. Brace-free; add this repo's fixtures or snapshots.
digest:
  exclude:
    - "**/*.test.*"
    - "**/tests/**"
    - "**/*.stories.*"
    - "**/generated/**"
    - "**/*.spec.*"
    - "**/*_test.*"
    - "**/test_*.*"
    - "**/test/**"
    - "**/*Tests/**"
    - "**/androidTest/**"

# `parity`: the CI job that asserts local and CI environments match; "" when none.
ci:
  parity: ""

board:
  platform: github
  project: "Graph Runs"

# Required gates are bound in each run's run.json; the Stop and lint hooks are
# opt-in through .claude/graph-checks.json (see templates/graph-checks.json).
