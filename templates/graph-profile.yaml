# graph-engineering project profile.
#
# This file belongs to THIS repo. A plugin update replaces agents, skills and
# playbooks; it never rewrites this. The engine belongs to the plugin, the
# profile belongs to you. That split is what makes updates safe.
#
# Generated by /graph-init. Edit freely. `/graph-init --upgrade` brings an older
# profile to this schema: it adds missing blocks, drops removed keys and shows a
# diff before it writes. Rollback is `git revert` of that commit.
schema_version: 2

# Where each stack lives. /graph-init derives this from the manifests it finds
# (package.json, pyproject.toml, go.mod, Cargo.toml, Package.swift,
# build.gradle.kts, ...): one entry per manifest directory, named by you, with
# the glob that actually contains the code, not "**". It ships empty, e.g.:
#   stacks:
#     api: { paths: ["services/api/**"] }   # services/api/pyproject.toml
#     ui:  { paths: ["ui/**"] }             # ui/package.json
#     cli: { paths: ["cmd/**", "internal/**"] }   # go.mod at the root
stacks: {}

# Rule packs agents Read before working. Path-scoped packs do NOT auto-load into
# a subagent, so they are named here and Read explicitly.
rules: [".claude/rules/*.md"]

# Files that steer agents. A diff here changes how every later run behaves, so
# it always gets a full review, even when it is only prose.
instructionPaths: ["CLAUDE.md", "**/CLAUDE.md", "AGENTS.md", ".claude/**"]

# Optional path to an owner access map (who can reach which accounts, CLIs and
# consoles). When set, the engine injects it into planner and spike briefs.
ownerAccess: ""

# Where specs and plans go. Override when the repo does not use docs/.
docsPath: "docs/superpowers"

# House rule: every change a user can see ships before/after evidence
# (screenshots, or <=30s recordings for flows), captured as code and committed
# here as <path>/<date>-<slug>/, embedded in the PR body. See `ux-evidence`.
uxEvidence:
  path: "docs/ux/changes"

# How qa stands this repo up. The qa node runs the change against a live stack,
# never against a shared environment; without this block it returns BLOCKED and
# the merge gate does not open. Each field is a shell command run from the repo
# root, so any stack works: compose, kind, `uv run`, `npm run dev`.
#   up      start the stack. Compose repos:
#             docker compose -p ge-${GRAPH_RUN_ID:?} up -d --wait --wait-timeout 120
#           `:?` makes an unset id fail loudly: agents pass it inline on each
#           call (a fresh shell per call), and a bare `${GRAPH_RUN_ID}`
#           left empty would run - and later `down -v` - project `ge-`.
#           `--wait` blocks on every service's healthcheck (a service with no
#           `healthcheck:` counts as ready the moment it starts). `-p` is not
#           optional: it overrides a top-level `name:` and the directory name,
#           so project-scoped containers and volumes are qa's own instead of
#           the developer's. It does NOT rename a volume or network with its
#           own `name:`, a service's `container_name:`, or anything
#           `external: true` - those stay shared, so qa's app could resolve
#           `db` to the developer's database, seed and fuzz it, and `down -v`
#           it. Rename or drop them in a committed override and pass it too:
#             docker compose -p ge-${GRAPH_RUN_ID:?} -f compose.yaml -f compose.qa.yaml up ...
#           compose.qa.yaml, BLOCK style (`${...}` inside a `{ }` flow map is
#           a YAML parse error):
#             services:
#               db:
#                 container_name: ge-${GRAPH_RUN_ID}-db
#                 networks: !override [appnet]      # drop external networks
#             networks:
#               appnet:
#                 name: ge-${GRAPH_RUN_ID}_net
#               corp_shared: !reset null            # an external network
#             volumes:
#               pgdata:
#                 name: ge-${GRAPH_RUN_ID}_pgdata
#           qa refuses to start while `compose_isolation.sh` (`qa-verification`)
#           finds any name without the `ge-${GRAPH_RUN_ID}` prefix, anything
#           external, host networking, a host-backed volume or a bind mount
#           from outside the worktree. The engine names GRAPH_RUN_ID in every
#           dispatch that stands the stack up.
#   seed    load deterministic data, once, after health passes. No spec has
#           this field (compose and devcontainer both lack it); it is ours.
#   port    the port `up` binds. qa checks it is FREE before `up`
#           (`lsof -nP -iTCP:<port> -sTCP:LISTEN` prints nothing); a port
#           already taken means health would be answered by some other process.
#   health  readiness. `url` is polled with
#           `curl -fsS --max-time 5 --retry <n> --retry-delay 2
#           --retry-max-time <timeout> --retry-connrefused --retry-all-errors`
#           (--max-time stops a listener that accepts and never answers from
#           holding the poll past `timeout`), and the body must contain
#           `expect`, matched as a substring of the raw body - so pick a token
#           without JSON spacing, e.g. `ok`, not `"status":"ok"`. A 200
#           proves something answered, `expect` proves it is this service.
#           `command` is the escape hatch for images with no curl or checks
#           that are not HTTP. Give one of url or command.
#   baseUrl what Bruno's `local` environment and Playwright point at.
#   down    always run afterwards, pass or fail. Compose:
#             docker compose -p ge-${GRAPH_RUN_ID:?} -f compose.yaml -f compose.qa.yaml down -v
#           Same -p and -f files as `up`: torn down with a different config,
#           the renamed volumes leak and `-v` targets the original names.
#   env     NAMES (never values) of the variables qa must have exported:
#           the API token Bruno passes as `--env-var` and Schemathesis as `-H`,
#           and anything `up` needs. Say in a comment where a local token
#           comes from - printed by `seed`, a fixture user, a dev-only signer.
#   none    a reason string, for a repo with nothing to stand up (a library,
#           a CLI, a plugin). Set, it replaces every field above: qa skips the
#           stand-up and verifies through the repo's own public surface - the
#           CLI invoked as a user would, the package imported from a clean
#           venv, the documented commands - and never returns BLOCKED for a
#           missing runtime. Empty for any repo that serves something.
# Every field ships empty: /graph-init fills what it detects and lists the
# rest as gaps. An empty required field is qa `BLOCKED` naming that field,
# which is clearer than a guessed command failing.
runtime:
  # Optional bounded harness owns setup, public checks, reports and cleanup.
  # If set, it replaces standalone up/seed/health/baseUrl/down below.
  # Reports identify the candidate, isolated runtime and every named case.
  command: ""
  up: ""
  seed: ""
  port: null
  health: { url: "", expect: "", timeout: 120 }
  baseUrl: ""
  down: ""
  env: []
  none: ""

# Where a merged change is checked after it deploys (`post-deploy-verification`).
# This is a SHARED environment: everything qa runs here is read-only - Bruno
# requests tagged `smoke` (GETs, or writes into `testTenant` only) and PromQL.
# qa never rolls back; `rollback` is the text it fills in for the owner. Leave
# `wait` empty and the deploy checks report SKIPPED (the whole node too when the
# plan has no `success_signals`); retro still runs.
#   wait        blocks until the merged commit serves, e.g.
#               argocd app wait <app> --sync --health --timeout 600
#   startedAt   prints (RFC3339) when the merged revision ${SHA} started rolling
#               out - the baseline ends there. Argo CD:
#               kubectl get application <app> -n argocd -o json | jq -r
#                 --arg s "$SHA" '[.status.history[] | select(.revision == $s)
#                 | .deployStartedAt] | min // empty'
#               Empty: the merge commit's time, which is never after the rollout.
#   bruEnv      the Bruno environment for the deployed target
#   env         NAMES of credential variables (never values)
#   testTenant  the tenant smoke writes may touch - a write runs only if
#               `{{testTenant}}` is a segment of its URL path; "" = reads only
#   checks      AnalysisTemplate-shaped checks, compared with the window
#               before the deploy (an absolute threshold alone lets a
#               0.1% -> 0.9% error ratio pass). `source` is prometheus
#               (default, reads `query`), or sentry, sql-readonly or command,
#               which read a `command` argv instead: the repo's own adapter,
#               run with no shell, printing one number or {"value": <n>} for
#               the window ending at $GRAPH_MEASURE_AT; rows are rejected:
#               - name: error-ratio
#                 source: prometheus
#                 query: '<ratio over [10m]>'
#                 initialDelay: 10m     # >= the query window
#                 interval: 60s
#                 count: 5
#                 failureLimit: 0
#                 successCondition: 'result[0] <= baseline[0] * 1.5 + 0.001'
#   rollback    the command the owner would run, filled in on FAIL
deploy:
  wait: ""
  startedAt: ""
  bruEnv: ""
  env: []
  testTenant: ""
  checks: []
  rollback: ""

# The investigate lane's signal source: an aggregates-only command with masked
# output that the investigate lane runs through the researcher's `signals` mode,
# verbatim, from the repo root. It prints counts, rates and top items by count,
# with pseudonymised ids in place of names, emails and raw user ids. Commit it
# in this repo (a script over your analytics, error tracker or a read-only
# database role) and give it one `privacy-review`. Empty: the investigate lane
# reports BLOCKED naming this key.
pulse:
  command: ""

# How qa proves an infra change (`infra-verification`). `cluster` is a
# THROWAWAY cluster the run creates and deletes, with its own kubeconfig file -
# never an existing cluster, never ~/.kube/config. Leave `cluster` empty for
# static-only verification (render, validate, policy, diff): qa then reports
# `PASS (static-only)` for what it checked, the merge gate shows that, and
# --auto-merge refuses it. A kind node image is about 1 GB; check disk first.
#   cluster.create   e.g. kind create cluster --name ge-${GRAPH_RUN_ID:?} --kubeconfig "<repo>/.graph/<run>/kubeconfig" --wait 120s
#   cluster.delete   e.g. kind delete cluster --name ge-${GRAPH_RUN_ID:?} --kubeconfig "<repo>/.graph/<run>/kubeconfig"
#   cluster.context  e.g. kind-ge-${GRAPH_RUN_ID}
#                    (qa sets KUBECONFIG to the ABSOLUTE path
#                    $REPO_ROOT/.graph/<run>/kubeconfig in the same command)
#   prereqs          pinned commands that install the operators/CRDs the
#                    rendered CRs need on the throwaway cluster (Argo CD, CNPG,
#                    Envoy Gateway, cert-manager...); a CR without its
#                    controller is validated but reported SKIPPED live
#   render           override for the Argo-faithful default render; ${APP} and
#                    ${OUT} are substituted per Application
#   policy           run per rendered file with ${RENDERED} set to its path,
#                    e.g. conftest test ${RENDERED} -p policy/ ; empty = none
infra:
  cluster: { create: "", delete: "", context: "" }
  prereqs: []
  render: ""
  policy: ""

# Commands run, in order, from the root of each new task worktree before any
# agent works in it: dependency install and code generation, so a fresh
# worktree builds and tests like the main checkout. /graph-init proposes them
# from the lockfiles it finds; it ships empty, e.g.:
#   bootstrap:
#     - pnpm install --frozen-lockfile --offline   # pnpm-lock.yaml
#     - uv sync --frozen                           # uv.lock
#     - xcodegen generate                          # project.yml
bootstrap: []

# Serialized host resources: lane name -> slots, the number of commands that
# may hold the lane at once. The engine wraps each command that uses a lane as
#   scripts/lane-run.sh <lane> --slots <n> -- <command>
# which holds the lock for the life of that process, so a killed agent frees
# it. Undeclared lanes are not serialized. It ships empty, e.g.:
#   lanes: {xcodebuild: 1, cluster: 1, local_db: 1}
#   xcodebuild  Xcode builds and tests (CPU, simulators, DerivedData)
#   cluster     the `infra.cluster` throwaway cluster (memory, disk)
#   local_db    a `runtime` stack not isolated per GRAPH_RUN_ID (one database)
lanes: {}

# The free-disk floor `graph-control host-check` holds before each
# implementation wave: below `min_free_gb` GB (10^9 bytes) on the run
# worktree's volume the wave is BLOCKED and becomes a decision card. /graph-init
# proposes it from the stack: 20 for container runtimes, device builds or
# `lanes`, less (5 is plenty) for a `runtime.none` library or CLI.
host:
  min_free_gb: 20

# House rule: every API change ships a Bruno suite in the same PR, and qa runs
# it against `runtime`. Bruno sets no convention for where a collection lives,
# so this is the house one. See `api-contract`.
api:
  collection: "bruno"
  env: "local"
  # The served schema Schemathesis generates from (a path under baseUrl, or a
  # repo file). api-contract requires every HTTP API to serve one.
  schema: "/openapi.json"

# The spine reads this to name each agent's REQUIRED skills in its dispatch.
# Agents never choose their own conditional skills: an agent that picks can skip
# loading and write from priors instead.
#
# `always` lenses are preloaded in the reviewer's frontmatter, so they cost no
# dispatch hop. Everything else is matched by path glob.
#
# Glob dialect: globstar (`**`) plus brace expansion, minimatch-style, matched
# against repo-relative paths. Check a row with
#   wcmatch.glob.globmatch(path, key, flags=GLOBSTAR | BRACE | DOTGLOB)
# `git ls-files <pattern>` is NOT a valid checker: git pathspec globs have no
# brace expansion, so every braced row here silently matches nothing there.
# A path may match several rows; the union of their skills is what gets routed.
routing:
  # Dependency-derived rows (applied by /graph-init)
  #
  # Framework skills route by what a manifest declares, never by a bare file
  # extension: a .ts file in an Express service is not React, a .py helper is
  # not FastAPI. This block is the single source /graph-init reads. For each
  # manifest it finds, it writes every row whose `when` holds into the table
  # below, with <dir> replaced by the manifest's directory relative to the repo
  # root; at the root the "<dir>/" prefix is dropped ("<dir>/**/*.py" becomes
  # "**/*.py"). Rules:
  #   - Rows with the same glob, derived or static, merge into one key: the
  #     union of their lists (a duplicate key fails preflight).
  #   - The nearest manifest owns a file. A workspace root (package.json with
  #     `workspaces`, or beside pnpm-workspace.yaml) that only holds tooling
  #     writes no stack row over its packages.
  #   - A dependency not listed here routes nothing. A manifest no row covers,
  #     and every `gap`, goes into the approval summary; never guess a skill.
  #   - pydantic-house-rules rides beside the vendored pydantic skill and wins
  #     where they disagree (house > vault-generated > community); the vendored
  #     file is never edited to say so.
  # Uncommented, the lines from `derived:` on are YAML.
  # derived:
  #   - when: package.json in <dir> depends on react (react-dom, next, ...)
  #     glob: "<dir>/**/*.{ts,tsx,js,jsx}"
  #     impl: [react-rules, frontend-rules, ux-evidence]
  #     review: [react-rules, frontend-rules, ux-evidence]
  #     qa: [ux-evidence]
  #   - when: the react package.json also depends on @tanstack/react-query
  #     glob: "<dir>/**/*.{ts,tsx,js,jsx}"
  #     impl: [tanstack-query-rules]
  #     review: [tanstack-query-rules]
  #   - when: the react package.json also depends on @tanstack/react-router
  #     glob: "<dir>/**/*.{ts,tsx,js,jsx}"
  #     impl: [tanstack-router]
  #   - when: the react package.json also depends on tailwindcss
  #     glob: "<dir>/**/*.{ts,tsx,js,jsx}"
  #     impl: [tailwind]
  #     review: [tailwind]
  #   - when: package.json in <dir> depends on tailwindcss
  #     glob: "<dir>/**/*.css"
  #     impl: [tailwind]
  #     review: [tailwind]
  #   - when: the react package.json also depends on react-hook-form, i18next or react-i18next
  #     glob: "<dir>/**/*.{ts,tsx,js,jsx}"
  #     impl: [forms-i18n]
  #     review: [forms-i18n]
  #   - when: package.json in <dir> has no UI framework (express, fastify, hono, @nestjs/core or none)
  #     glob: "<dir>/**/*.{ts,js}"
  #     impl: [backend-rules]
  #     review: [backend-rules]
  #   - when: turbo.json at the repo root
  #     glob: "{**/turbo.json,pnpm-workspace.yaml,**/package.json}"
  #     impl: [turborepo]
  #     review: [turborepo]
  #   - when: pyproject.toml in <dir> depends on pydantic (fastapi implies it)
  #     glob: "<dir>/**/*.py"
  #     impl: [pydantic, pydantic-house-rules]
  #     review: [pydantic, pydantic-house-rules]
  #   - when: pyproject.toml in <dir> depends on fastapi
  #     glob: "<dir>/**/*.py"
  #     impl: [fastapi, backend-rules, architecture-resilience-rules]
  #     review: [fastapi, backend-rules, architecture-resilience-rules]
  #   - when: pyproject.toml in <dir> depends on sqlalchemy or alembic
  #     glob: "<dir>/**/{models,db,migrations}/**/*.py"
  #     impl: [sqlalchemy]
  #     review: [sqlalchemy]
  #   - when: pyproject.toml in <dir> depends on sqlalchemy or alembic
  #     glob: "<dir>/**/alembic/**"
  #     impl: [sqlalchemy]
  #     review: [sqlalchemy]
  #   - when: pyproject.toml in <dir> depends on temporalio
  #     glob: "<dir>/**/{workflows,activities}/**/*.py"
  #     impl: [temporal-developer, architecture-resilience-rules]
  #     review: [temporal-developer, architecture-resilience-rules]
  #   - when: pyproject.toml in <dir> depends on agent-framework
  #     glob: "<dir>/**/agents/**/*.py"
  #     impl: [microsoft-agent-framework, agent-workflow-rules]
  #     review: [microsoft-agent-framework, agent-workflow-rules]
  #   - when: pyproject.toml in <dir> depends on pydantic-ai
  #     glob: "<dir>/**/agents/**/*.py"
  #     impl: [building-pydantic-ai-agents, agent-workflow-rules]
  #     review: [building-pydantic-ai-agents, agent-workflow-rules]
  #   - when: pyproject.toml in <dir> depends on loguru
  #     glob: "<dir>/**/logging*.py"
  #     impl: [loguru]
  #     review: [loguru]
  #   - when: a manifest in <dir> depends on a NATS client (nats-py, nats, nats.go, async-nats)
  #     glob: "<dir>/**/{bus,events,messaging}/**"
  #     impl: [nats, architecture-resilience-rules]
  #     review: [nats, architecture-resilience-rules, security-review]
  #   - when: a .swift file under <dir> imports SwiftUI (<dir> holds Package.swift, project.yml or the .xcodeproj)
  #     glob: "<dir>/**/*.swift"
  #     impl: [swiftui-pro, ux-evidence]
  #     review: [swiftui-pro, ux-evidence]
  #     qa: [ux-evidence]
  #   - when: the Gradle build in <dir> uses androidx.compose
  #     glob: "<dir>/**/*.{kt,kts}"
  #     impl: [compose-state, compose-ui, ux-evidence]
  #     review: [compose-performance, compose-state, ux-evidence]
  #     qa: [compose-build-and-test, ux-evidence]
  #   - when: supabase/config.toml under <dir> (<dir> holds the supabase/ directory)
  #     glob: "<dir>/supabase/**"
  #     impl: [supabase, supabase-postgres-best-practices]
  #     review: [supabase, supabase-postgres-best-practices]
  #   - when: go.mod, Cargo.toml, Gemfile or pom.xml in <dir>
  #     glob: "<dir>/**"
  #     impl: [backend-rules]
  #     review: [backend-rules]
  #     gap: "the plugin has no Go, Rust, Ruby or Java stack skill; name the language found"

  # Static rows: language- or file-type-level only. ux-evidence rides on the UI
  # rows the block above writes: the implementer captures, the reviewer checks,
  # qa verifies against the running system.
  #
  # Turborepo + pnpm workspaces: the root pipeline, any package-level
  # turbo.json (`extends: ["//"]`) and the workspace list. Package manifests
  # join when a root turbo.json exists (block above).
  "{**/turbo.json,pnpm-workspace.yaml}":
    impl: [turborepo]
    review: [turborepo]
  # Apple frameworks, by the Swift files named for them; adjust the globs to
  # your naming. Swift only, so a web NotificationBell.tsx never routes
  # push-notifications.
  "**/{Health,Workout}*.swift": { impl: [healthkit] }
  "**/{Widget,LiveActivity}*.swift": { impl: [widgetkit, activitykit] }
  "**/{Photo,Camera}*.swift": { impl: [photokit] }
  "**/*[Nn]otification*.swift": { impl: [push-notifications] }
  # Kotlin language rules. Compose rides on top only where the Gradle build
  # uses it (block above).
  "**/*.{kt,kts}":
    impl: [kotlin-concurrency, kotlin-types-value-class]
    review: [kotlin-control-flow]
  # Postgres SQL; drop the row if the database is not Postgres. The supabase
  # skill itself routes only in a Supabase project (block above).
  "**/*.sql":
    impl: [supabase-postgres-best-practices]
    review: [supabase-postgres-best-practices]
    qa: []
  # Data-touching changes pull the consent and erasure lenses in addition to
  # the always-on privacy-review, which only classifies.
  "**/{migrations,schemas}/**":
    impl: [gdpr-erasure-retention]
    review: [gdpr-erasure-retention, gdpr-consent]
    qa: []
  # Python toolchain: uv projects linted with ruff. Drop both here and on the
  # manifest row below if the repo uses another toolchain (poetry, pip-tools,
  # black, flake8). ruff is on every .py file and not only on pyproject.toml:
  # the lint is configured there but enforced per file. Frameworks (pydantic,
  # FastAPI, SQLAlchemy, Temporal, agents, loguru) come from the block above.
  "**/*.py":
    impl: [uv, ruff]
    review: [ruff]
    qa: []
  # Project and lock files: environment and dependency work is uv's, not the
  # framework's.
  "**/{pyproject.toml,uv.lock,.python-version}":
    impl: [uv]
    review: [uv]
  # Alembic's own tree: env.py, script.py.mako and the versions/ directory. A
  # directory named alembic is itself the signal, so this row is static. Not
  # restricted to *.py - alembic.ini and the mako template are part of the same
  # change, and a migration review that cannot see them is half a review.
  "**/alembic/**":
    impl: [sqlalchemy]
    review: [sqlalchemy]
  # NATS, cluster half: a glob cannot see `apiVersion: jetstream.nats.io`, so -
  # like the postgres/cnpg rows below - route on the names that hold the server
  # config, the per-user allow-lists and the Stream/Consumer CRs (for example a
  # manifests/nats-streams/ directory or an argocd/apps/nats.yaml Application).
  # The authorization half is where NATS goes wrong silently, hence security-review.
  "**/nats*/**":
    impl: [nats]
    review: [nats, security-review]
  "**/nats*.{yaml,yml}":
    impl: [nats]
    review: [nats, security-review]
  # GitOps: Argo CD Applications. Argo renders Helm and kustomize, so both ride
  # along; kubectl is on the qa half because verification happens on a cluster.
  # infra-verification (render, validate, diff, ephemeral apply) rides on every
  # infra row: the implementer produces the rendered diff, qa runs the recipe.
  "argocd/**/*.{yaml,yml}":
    impl: [argocd, helm, kubectl, architecture-resilience-rules, infra-verification]
    review: [argocd, helm]
    qa: [kubectl, infra-verification]
  # Plain Kubernetes manifests, kustomize overlays included.
  "manifests/**":
    impl: [kubectl, kustomize, infra-verification]
    review: [kubectl]
    qa: [kubectl, infra-verification]
  # Helm: a chart's metadata, and the templates it renders. The templates row is
  # anchored under chart/ or charts/ on purpose: a bare **/templates/** also
  # matches every other meaning of the word, including this plugin's own
  # templates/graph-profile.yaml, and would route helm at a profile edit.
  "**/Chart.yaml":
    impl: [helm, infra-verification]
    review: [helm]
    qa: [infra-verification]
  "**/{chart,charts}/**/templates/**/*.{yaml,yml,tpl}":
    impl: [helm, infra-verification]
    review: [helm]
    qa: [infra-verification]
  "**/kustomization.{yaml,yml}":
    impl: [kustomize, infra-verification]
    review: [kustomize]
    qa: [infra-verification]
  # CloudNativePG: a glob cannot see `apiVersion: postgresql.cnpg.io`, so route on
  # the directory that holds your Cluster manifests (for example
  # manifests/<app>-pg/, which the *-pg rows below match).
  "**/{postgres,cnpg}/**":
    impl: [cloudnativepg]
    review: [cloudnativepg]
  "**/*-pg/**":
    impl: [cloudnativepg]
    review: [cloudnativepg]
  "**/*-pg-*/**":
    impl: [cloudnativepg]
    review: [cloudnativepg]
  # Envoy Gateway: manifests named by kind, plus the gateway-* directories that
  # hold the policies and their exemptions. An Argo CD Application named after a
  # gateway (argocd/apps/gateway-auth.yaml) matches the kind row too; that is a
  # known false positive and it is harmless, because the Application renders
  # those very manifests and rows are additive.
  "**/{httproute,securitypolicy,backendtlspolicy,backendtrafficpolicy,clienttrafficpolicy,gateway,gatewayclass,referencegrant}*.{yaml,yml}":
    impl: [envoy-gateway]
    review: [envoy-gateway, security-review]
  "**/{gateway,gateway-*}/**":
    impl: [envoy-gateway]
    review: [envoy-gateway, security-review]
  # LLM gateway: agent-router, the successor to Envoy AI Gateway.
  "**/{ai-gateway,agent-router,llm-gateway}/**":
    impl: [agent-router, envoy-gateway]
    review: [agent-router, security-review]
  # Secrets: sops + age. security-review is always on and is repeated here on
  # purpose, because a secrets diff is where it earns its keep.
  "{.sops.yaml,**/*.enc.yaml,**/*.enc.yml}":
    impl: [sops-age]
    review: [sops-age, security-review]
    qa: []
  # QA: Playwright specs. A derived TS row can match them too; the union is
  # intended, a spec is still TypeScript.
  "{tests/**/*.spec.ts,playwright.config.ts}":
    impl: [playwright-cli, playwright-component-testing]
    review: [playwright-cli]
    qa: [playwright-cli, playwright-trace, ux-evidence]
  # API collections: Bruno runs them in CI, so it is an implementation and a qa
  # competency both.
  "{**/*.bru,**/bruno.json}":
    impl: [bruno, api-contract]
    review: [bruno, api-contract]
    qa: [bruno, api-contract]
  # API surfaces: an edit here must ship a Bruno update and a current schema,
  # and qa runs Schemathesis against it (`api-contract`), so the competency is
  # routed by the code that changes the contract, not only by the .bru files.
  # No framework enforces a layout; these are the common SERVER-side ones plus
  # the spec file, the only cross-framework anchor.
  #
  # `routes/` and `handlers/` are restricted to server-only languages on
  # purpose: in TypeScript they are just as often the frontend - TanStack
  # Router and Remix `src/routes/*.tsx`, SvelteKit `src/routes/`, Angular
  # `app.routes.ts`, MSW `mocks/handlers/*.ts` - and routing api-contract
  # there makes a route-component task demand a Bruno suite and a schema the
  # SPA cannot serve, so qa blocks forever. An Express/Hono/Fastify repo whose
  # TS routes are server code gets its own row from /graph-init, which finds
  # them by content (`Router()`, `app.get(`), not by name.
  "**/{routers,controllers,endpoints}/**/*.{py,go,java,kt,rb,ts,js}":
    impl: [bruno, schemathesis, api-contract]
    review: [api-contract]
    qa: [bruno, schemathesis, api-contract]
  "**/{routes,handlers}/**/*.{py,go,java,kt,rb}":
    impl: [bruno, schemathesis, api-contract]
    review: [api-contract]
    qa: [bruno, schemathesis, api-contract]
  # NestJS `nest g controller` output, and Next.js route handlers.
  "{**/*.controller.{ts,js},**/app/api/**/route.{ts,js},**/pages/api/**/*.{ts,js}}":
    impl: [bruno, schemathesis, api-contract]
    review: [api-contract]
    qa: [bruno, schemathesis, api-contract]
  "**/{openapi,asyncapi,swagger}*.{yaml,yml,json}":
    impl: [bruno, schemathesis, api-contract]
    review: [api-contract]
    qa: [bruno, schemathesis, api-contract]
  # Observability: PromQL for metrics and alert rules, LogQL for logs, TraceQL for
  # traces. Dashboards are JSON, alert rules are YAML.
  "{observability/**,**/dashboards/**/*.json,**/*rule*.{yaml,yml}}":
    impl: [promql, loki, tempo]
    review: [promql, loki, tempo]
    qa: [promql, loki, tempo]
  always:
    # prior-art is the research-before-work house rule: the planner has it
    # preloaded, every implementer loads it, the reviewer checks for its note.
    # review-testing-rules is the pack every task in every stack reads; it is
    # portable now that it ships in the plugin instead of one machine's ~/.claude.
    # definition-of-done and impact-map are NOT listed here: they apply to every
    # task, so implementers, planner and reviewer preload them in frontmatter
    # (spec 2.3). That also covers profiles written before 0.10.0.
    # Names stay bare here; the engine qualifies them at dispatch.
    impl: [prior-art, review-testing-rules]
    review: [review-protocol, security-review, privacy-review]
    design: [ux-journey, ui-ux-pro-max]

# Defer to an agent this repo already owns. This is the additive contract: where
# a local agent covers a leg, the engine dispatches it instead of the plugin's.
# Empty means use the full plugin roster.
localAgents: {}

# Extra local agents that run BESIDE the plugin one for a role, not instead of
# it, e.g. { review: [<agent-name>] }. Role -> list of .claude/agents names.
localLanes: {}

# Model tier per roster role. This block is the single source of model tiers:
# the engine dispatches each role on its tier, and the guard-agent PreToolUse
# hook blocks an Agent call whose type is in `block_types` or whose model is in
# `never`. A dispatch whose prompt carries a line `policy-override: <reason>`
# skips the guard; the override is logged to the ledger. `reviewer-lead` and
# `qa-lead` are the reviewer and qa dispatched as leads over parallel leaves;
# each leaf keeps its own role's tier. `researcher-spike` is the spike agent.
# Tiers are opus or sonnet only.
policy:
  roles:
    planner: opus
    ux-designer: opus
    implementer: opus
    reviewer: opus
    reviewer-lead: opus
    implementer-simple: sonnet
    researcher: sonnet
    researcher-spike: sonnet
    qa: sonnet
    qa-lead: sonnet
    retro: sonnet
  never: [haiku, fable]
  block_types: [general-purpose]

# Risk classes: the one table the router, the review-depth check and the gates
# below read. A diff matches a row when a changed path matches one of `paths`
# (the routing glob dialect) or an added line contains one of `keywords`
# (literal and case-sensitive: write them the way the code spells them). A risk
# match forces at least the `quick` lane. These lists are starting points kept
# deliberately tight; tune them to this repo, since every extra keyword is a
# false positive that costs an owner gate.
#
# One more row is built in, not listed here, and reserved: `agent-control`, the
# agent's own control plane: .claude/** (at any depth), CLAUDE.md, AGENTS.md,
# .mcp.json and .github/** anywhere they apply, plus every `instructionPaths`
# glob above. A diff there rewrites the checks, hooks, permissions, gates and
# prompts later runs obey, including this file, so `graph-control depth`
# always reports it, it always waits for the owner, and no profile can drop or
# redefine it (a row with that id is rejected).
risk:
  - id: db-schema
    paths: ["**/migrations/**", "**/*.sql", "**/alembic/**"]
    keywords: ["DROP TABLE", "ALTER TABLE"]
  - id: api-surface   # the API-surface rows from `routing`; keep the two in step
    paths:
      - "**/{routers,controllers,endpoints}/**/*.{py,go,java,kt,rb,ts,js}"
      - "**/{routes,handlers}/**/*.{py,go,java,kt,rb}"
      - "{**/*.controller.{ts,js},**/app/api/**/route.{ts,js},**/pages/api/**/*.{ts,js}}"
      - "**/{openapi,asyncapi,swagger}*.{yaml,yml,json}"
    keywords: []
  - id: auth
    paths: ["**/{auth,authz,authentication,permissions,rbac}/**"]
    keywords: []
  - id: infra
    paths: ["argocd/**", "manifests/**", "**/Chart.yaml", "**/*.tf", ".github/workflows/**"]
    keywords: []
  - id: public-copy
    # The repo lists its public pages and templates here (marketing site,
    # docs site, store listing); nothing generic can guess them.
    paths: []
    keywords: []
  - id: outbound-messaging
    paths: ["**/{email,emails,mailers,notifications,notifier*}/**"]
    keywords: []
  - id: spend
    # Keywords are the provider's call spellings, never bare words: `stripe`
    # alone matches `table-striped` and `charge` matches `recharge`. Add this
    # repo's provider calls (a client name, `charges.create`) when it has them.
    paths: ["**/{billing,payments}/**"]
    keywords: ["stripe.", "Stripe("]
  - id: destructive
    paths: []
    keywords: ["DROP ", "TRUNCATE", "DELETE FROM"]
  - id: credentials-and-access
    paths: [".sops.yaml", "**/*.enc.{yaml,yml}", "**/.env*"]
    keywords: []
  - id: outside-the-run
    # No globs: `graph-control depth --plan <run>/plan.json` reports this row
    # when a changed path matches no task's writable_paths. Without a plan (the
    # direct lane) it is not evaluated. Remove the row to switch the check off.
    paths: []
    keywords: []

# Who approves. `plan` and `merge` take one value, `owner`: the plan gate always
# stops, and the merge gate stops unless the class lists below open it. The
# class lists name risk ids from the table above, plus `none`: a diff that
# matches no risk row.
#   owner_classes  a diff matching any of these always waits for the owner at
#                  merge, whatever else is set.
#   auto_classes   diffs whose every class is listed here merge on their own on
#                  full green: no blocking or important findings left, qa a
#                  full PASS, `verify` passing. `[none]` auto-merges diffs that
#                  touch no risk row. Empty keeps every merge with the owner.
# `agent-control` (built in, see `risk:`) always waits for the owner, even
# under `--auto-merge`; listing it anywhere changes nothing.
gates:
  plan: owner   # also the design gate: the plan embeds the `design` node's spec
  merge: owner
  owner_classes: [destructive, credentials-and-access, spend, outbound-messaging]
  auto_classes: []

# How a merged run lands: `pr` opens a pull request; `push-main` pushes to the
# default branch after the merge gate, for repos that trunk-deploy.
integration: pr

# Review depth. `panel_lines`: a diff over this many changed lines gets a panel
# review. `seams`: lists of stack names from `stacks`; a diff touching every
# stack of one list gets a panel review, e.g. [[api, web]].
review:
  panel_lines: 2000
  seams: []

# The change digest at the merge gate counts lines of code without these globs:
# tests, stories and generated code are excluded from LOC, so the number tracks
# the product change. Same glob dialect as `routing`, kept brace-free. The
# defaults cover the common test layouts (JS/TS, Python, Go, JVM, Xcode,
# Android); add this repo's own, such as a snapshot or fixtures directory.
digest:
  exclude:
    - "**/*.test.*"
    - "**/tests/**"
    - "**/*.stories.*"
    - "**/generated/**"
    - "**/*.spec.*"
    - "**/*_test.*"
    - "**/test_*.*"
    - "**/test/**"
    - "**/*Tests/**"
    - "**/androidTest/**"

# `parity`: the name of the CI job that asserts local and CI environments match
# (the same env vars, flags and build config). Empty when the repo has none.
ci:
  parity: ""

board:
  platform: github
  project: "Graph Runs"

# Required gates are bound in each run's run.json (docs/graph-controls.md).
# The Stop and lint hooks are opt-in: commit .claude/graph-checks.json (see
# templates/graph-checks.json) to give them the commands this repo runs.
# Without that file they do nothing. Model tiers live in `policy:` above.
